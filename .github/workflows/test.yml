name: HumanHub validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [develop/humanhub-v2]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check intelligence/app.js
      - run: node --input-type=module --check < js/aggregate-export.js
      - run: node --input-type=module --check < js/app.js
